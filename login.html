<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to your H&P FATION HUB account.">
  <title>Log in | H&amp;P FATION HUB</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">H&amp;P <span>FATION HUB</span></a>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="men.html">Men</a>
      <a href="women.html">Women</a>
      <a href="kids.html">Kids</a>
    </nav>
    <div class="header-actions">
      <a class="login-link active-login" href="login.html" aria-current="page">Log in</a>
    </div>
  </header>

  <main class="login-main">
    <section class="login-card">
      <p class="eyebrow">WELCOME BACK</p>
      <h1>Log in to your<br><span>account.</span></h1>
      <p class="login-intro">Sign in to keep your everyday favourites close.</p>
      <form class="login-form" action="login.html" method="post">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
        <button class="button button-dark" type="submit">Log in <span aria-hidden="true">→</span></button>
      </form>
      <p class="login-note">New to H&amp;P FATION HUB? Create an account at checkout.</p>
    </section>
  </main>

  <footer class="site-footer">
    <a class="brand" href="index.html">H&amp;P <span>FATION HUB</span></a>
    <p>Everyday style for everyone.</p>
    <span>© 2025 H&amp;P FATION HUB</span>
  </footer>
</body>
</html>
